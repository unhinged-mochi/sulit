name: Refresh promos

on:
  schedule:
    - cron: '0 21 * * *' # 05:00 Manila, before people head out
  workflow_dispatch:
    inputs:
      banks:
        description: 'Only these banks (space-separated, e.g. "bpi bdo"). Empty = all.'
        required: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # three banks sit behind bot walls and need a real browser
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Scrape, extract, geocode
        run: pnpm refresh ${{ inputs.banks }}
        env:
          # optional: without it, extraction falls back to regex
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "sulit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: refresh $(date -u +%F)"
          git push
