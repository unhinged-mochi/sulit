<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1a2b" />
    <title>Sulit · Card promos near you</title>
    <meta name="description" content="Every Philippine credit card promo on one map, filtered to the cards in your wallet. Updated daily from the banks' own promo pages." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip" href="#list">Skip to promo list</a>
    <header class="wallet" aria-label="My cards">
      <a class="mark" href="/" aria-label="Sulit home">Sulit</a>
      <span class="wallet-label" aria-hidden="true">Your cards</span>
      <div class="wallet-chips" role="group" aria-label="Show promos for these banks" id="wallet"></div>
    </header>

    <main class="stage">
      <p class="hint" id="hint" hidden><b>Start here:</b> tap the banks you carry. Sulit hides promos your cards can’t use.</p>
      <div id="map" class="map" role="application" aria-label="Map of promos. Use the list for the same promos as text."></div>

      <section class="sheet" id="sheet" aria-label="Promos">
        <button class="sheet-grip" id="grip" aria-label="Expand list" aria-controls="sheet"><span></span></button>
        <div class="sheet-head">
          <div class="tabs" role="tablist">
            <button role="tab" id="tab-here" aria-selected="true" aria-controls="list">On the map <b id="count-here">0</b></button>
            <button role="tab" id="tab-anywhere" aria-selected="false" aria-controls="list" tabindex="-1">Online &amp; everywhere <b id="count-anywhere">0</b></button>
          </div>
          <div class="finder">
            <label class="search"><span class="sr">Search merchant or mall</span><input type="search" id="q" placeholder="Merchant or mall" autocomplete="off" enterkeyhint="search" /></label>
            <button class="near" id="near" type="button">Near me</button>
          </div>
          <div class="filters" role="group" aria-label="Filter">
            <label class="soon"><input type="checkbox" id="soon" /> Ending this week</label>
            <div class="cats" id="cats"></div>
          </div>
        </div>
        <div class="sheet-body" id="sheet-body">
          <article class="detail" id="detail" hidden aria-label="Promo details"></article>
          <ol class="list" id="list" role="tabpanel" aria-labelledby="tab-here"></ol>
          <footer class="fresh" id="fresh"></footer>
        </div>
      </section>
    </main>
    <dialog class="cards" id="cards" aria-labelledby="cards-title">
      <form method="dialog">
        <h2 id="cards-title">Your cards</h2>
        <p class="cards-hint">Some promos only take certain cards. Tick the ones in your wallet. <span id="cards-any"></span></p>
        <ul class="cards-list" id="cards-list"></ul>
        <div class="cards-actions">
          <button type="button" class="cards-remove" id="cards-remove">Remove</button>
          <button class="cards-done" autofocus>Done</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
